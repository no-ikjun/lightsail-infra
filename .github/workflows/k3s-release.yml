name: Shared k3s release

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      image_repository:
        type: string
        required: true
      production_branch:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      build_context:
        type: string
        default: .
      deploy:
        description: Set false to publish the first image before bootstrapping a new service.
        type: boolean
        default: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      LIGHTSAIL_HOST:
        required: true
      LIGHTSAIL_USERNAME:
        required: true
      LIGHTSAIL_SSH_KEY:
        required: true
      LIGHTSAIL_KNOWN_HOSTS:
        required: true
      SSH_PORT:
        required: false
    outputs:
      image:
        description: Published immutable image reference
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read

# Concurrency belongs to the caller; using its group here would deadlock it.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image: ${{ format('{0}@{1}', inputs.image_repository, steps.image.outputs.digest) }}
    steps:
      - name: Validate release request
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          PRODUCTION_BRANCH: ${{ inputs.production_branch }}
          SELECTED_REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          [[ "$SERVICE" =~ ^[a-z][a-z0-9-]{0,39}$ ]]
          [[ "$IMAGE_REPOSITORY" =~ ^docker\.io/[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_.-]*$ ]]
          [[ "$SELECTED_REF" == "refs/heads/$PRODUCTION_BRANCH" ]]
          [[ "$EVENT" == push || "$EVENT" == workflow_dispatch ]]
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish immutable release
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ inputs.image_repository }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published image
        env:
          IMAGE: ${{ inputs.image_repository }}@${{ steps.image.outputs.digest }}
        run: |
          printf 'Published image: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy registered service and verify
        env:
          APP: ${{ inputs.service }}
          IMAGE: ${{ needs.publish.outputs.image }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USERNAME: ${{ secrets.LIGHTSAIL_USERNAME }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${APP:?}" "${IMAGE:?}" "${GITHUB_SHA:?}" "${GITHUB_RUN_NUMBER:?}" "${GITHUB_RUN_ID:?}" "${GITHUB_RUN_ATTEMPT:?}"
          : "${LIGHTSAIL_HOST:?}" "${LIGHTSAIL_USERNAME:?}" "${LIGHTSAIL_SSH_KEY:?}" "${LIGHTSAIL_KNOWN_HOSTS:?}" "${RUNNER_TEMP:?}"
          [[ "$APP" =~ ^[a-z][a-z0-9-]{0,39}$ ]]
          [[ "$IMAGE" =~ ^docker\.io/[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_.-]*@sha256:[a-f0-9]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "${SSH_PORT:-22}" =~ ^[0-9]+$ ]]
          key_file=$(mktemp "$RUNNER_TEMP/lightsail-key.XXXXXX")
          hosts_file=$(mktemp "$RUNNER_TEMP/lightsail-hosts.XXXXXX")
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$hosts_file"
          chmod 600 "$key_file"
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$key_file"
          ssh -i "$key_file" -p "${SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=lightsail-production \
            -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$LIGHTSAIL_USERNAME@$LIGHTSAIL_HOST" \
            "sudo -n /usr/local/sbin/lightsail-k3s-deploy $APP $IMAGE $GITHUB_SHA $GITHUB_RUN_NUMBER $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT"
      - name: Record successful deployment
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          printf '### %s deployment\n\nCommit: `%s`\n\nImage: `%s`\n' \
            "$SERVICE" "$GITHUB_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
